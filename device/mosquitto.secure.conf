# 현장 설치용 MQTT 브로커: 계정 없는 접속 금지, 기기별 쓰기 권한, TLS 암호화.
# 준비 (docs/integration.md "MQTT 보안" 참고):
#   1) 계정: mosquitto_passwd -c device/passwd dashboard   (이어서 -b 없이 L-01, cam-1, vms-zone ... 추가)
#   2) 인증서: 기관 CA 또는 자체 CA로 server.crt / server.key 발급, 기기에는 ca.crt 배포
#   3) 실행: mosquitto -c device/mosquitto.secure.conf
per_listener_settings false
allow_anonymous false
password_file device/passwd
acl_file device/mosquitto.acl

# 기기용 MQTT over TLS
listener 8883
protocol mqtt
cafile device/certs/ca.crt
certfile device/certs/server.crt
keyfile device/certs/server.key
tls_version tlsv1.2

# 관제 화면용 WebSocket over TLS (브라우저에서 wss://dashboard:<비밀번호>@<주소>:9443)
listener 9443
protocol websockets
cafile device/certs/ca.crt
certfile device/certs/server.crt
keyfile device/certs/server.key
tls_version tlsv1.2
