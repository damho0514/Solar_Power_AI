# 노트북 한 대 시연용 MQTT 브로커: 이 컴퓨터 안에서만 접속할 수 있다 (같은 와이파이의 다른 사람은 못 붙는다).
# 실행: mosquitto -c device/mosquitto.conf
# 1883 = 기기 프로그램(Python), 9001 = 관제 화면(브라우저, WebSocket)
# 라즈베리파이 같은 다른 기기를 붙이는 현장 설치에는 device/mosquitto.secure.conf를 쓴다 (계정·권한·TLS).
listener 1883 127.0.0.1
protocol mqtt

listener 9001 127.0.0.1
protocol websockets

allow_anonymous true
