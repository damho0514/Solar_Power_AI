# 관제 PC(또는 서버)에서 돌리는 MQTT 브로커 설정
# 실행: mosquitto -c device/mosquitto.conf
# 1883 = 라즈베리파이 등 기기가 접속 (MQTT)
# 9001 = 관제 화면(브라우저)이 접속 (MQTT over WebSocket)
# 주의: PoC 데모용으로 익명 접속을 허용한다. 현장 설치 때는 password_file과 TLS를 켤 것.
listener 1883
protocol mqtt

listener 9001
protocol websockets

allow_anonymous true
